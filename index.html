<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f7fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Glass Tasks</title>
  </head>
  <body>
    <div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="root">
      <!-- Boot shell: shown before JS runs. The composer is a real input so typing can start immediately. -->
      <div class="app boot" aria-busy="true">
        <header class="topbar glass"><span class="sk sk-circle"></span><span class="sk sk-pill" style="width:96px"></span></header>
        <main class="page">
          <div class="sk sk-carousel"></div>
          <div class="sk-dots"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
          <div class="sk sk-line" style="width:40%;margin:28px 4px 14px"></div>
          <div class="sk-group glass"><div class="sk-row"><span class="sk sk-dot"></span><span class="sk sk-line"></span></div><div class="sk-row"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:60%"></span></div><div class="sk-row"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:75%"></span></div></div>
        </main>
        <form class="composer glass" onsubmit="return false">
          <span class="sk sk-chip"></span>
          <input id="boot-input" class="composer-input" placeholder="タスクを追加" aria-label="タスクを追加" autocomplete="off" enterkeyhint="done" />
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
